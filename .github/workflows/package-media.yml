name: Package media (single MP4)

# Video + harici sesleri FFmpeg stream-copy ile tek MP4'e mux eder.
# HLS/m3u8/ts segmenti uretmez. VTT/SRT sidecar kalir.
on:
  push:
    branches: [main]
    paths:
      - ".github/remux-jobs/*.json"
  repository_dispatch:
    types: [package-media]
  workflow_dispatch:
    inputs:
      payload:
        description: "package-media.mjs client_payload JSON metni"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ffmpeg kontrolu
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version

      - name: Bagimliliklari kur
        run: npm install --workspaces=false --no-save @huggingface/hub

      - name: Payload hazirla
        env:
          DISPATCH_PAYLOAD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.payload || toJson(github.event.client_payload) }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            JOB_FILE=$(find .github/remux-jobs -maxdepth 1 -type f -name '*.json' -print | sort | tail -n 1)
            if [ -z "$JOB_FILE" ] || [ ! -f "$JOB_FILE" ]; then
              echo "Remux job dosyasi bulunamadi"
              exit 1
            fi
            echo "Remux job: $JOB_FILE"
            cp "$JOB_FILE" /tmp/payload.json
          else
            printf '%s' "$DISPATCH_PAYLOAD" > /tmp/payload.json
          fi
          cat /tmp/payload.json

      - name: Script syntax kontrolu
        run: node --check .github/scripts/package-media.mjs

      - name: Sesleri tek MP4'e mux et ve yukle
        id: package
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ACCOUNTS_JSON: ${{ secrets.HF_ACCOUNTS_JSON }}
        run: |
          set +e
          PAYLOAD=$(cat /tmp/payload.json)
          node .github/scripts/package-media.mjs "$PAYLOAD" > /tmp/result.json 2> /tmp/remux-error.log
          CODE=$?
          set -e
          cat /tmp/result.json || true
          cat /tmp/remux-error.log >&2 || true
          exit "$CODE"

      - name: Katalogu guncelle
        run: node .github/scripts/update-catalog.mjs "$(cat /tmp/result.json)"

      - name: Katalog commit ve push
        run: |
          git config user.name "film2-bot"
          git config user.email "actions@users.noreply.github.com"
          TITLE_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/result.json','utf-8')).titleId)")
          git add catalog/
          git diff --cached --quiet || git commit -m "chore(catalog): tek MP4 medya hazir ($TITLE_ID)"
          git push

      - name: Remux durumunu kaydet
        if: always()
        run: |
          git config user.name "film2-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .github
          {
            echo "status=${{ job.status }}"
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -f /tmp/remux-error.log ]; then
              echo "--- error ---"
              tail -n 80 /tmp/remux-error.log
            fi
            if [ -f /tmp/result.json ]; then
              echo "--- result ---"
              cat /tmp/result.json
            fi
          } > .github/remux-last-status.txt
          git add .github/remux-last-status.txt
          git diff --cached --quiet || git commit -m "chore(remux): son is durumu"
          git pull --rebase origin main || true
          git push || true
