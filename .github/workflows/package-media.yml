name: Package media (single MP4)

# Studio ham video + ses + altyaziyi Hugging Face'e yukledikten sonra bu workflow'u
# workflow_dispatch ile tetikler. ffmpeg yalnizca stream-copy REMUX yapar:
# video ve ses yeniden encode edilmez, HLS/m3u8/ts segmenti uretilmez.
# Son oynatma medyasi tek video.mp4 olur; VTT/SRT altyazilar sidecar kalir.
on:
  repository_dispatch:
    types: [package-media]
  workflow_dispatch:
    inputs:
      payload:
        description: "package-media.mjs client_payload JSON metni"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ffmpeg kontrolu
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version

      - name: Bagimliliklari kur
        run: npm install --workspaces=false --no-save @huggingface/hub

      - name: Sesleri tek MP4'e mux et ve yukle
        id: package
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ACCOUNTS_JSON: ${{ secrets.HF_ACCOUNTS_JSON }}
        run: |
          node .github/scripts/package-media.mjs '${{ github.event_name == 'workflow_dispatch' && github.event.inputs.payload || toJson(github.event.client_payload) }}' > /tmp/result.json
          cat /tmp/result.json

      - name: Katalogu guncelle
        run: node .github/scripts/update-catalog.mjs "$(cat /tmp/result.json)"

      - name: Commit ve push
        run: |
          git config user.name "film2-bot"
          git config user.email "actions@users.noreply.github.com"
          TITLE_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/result.json','utf-8')).titleId)")
          git add catalog/
          git diff --cached --quiet || git commit -m "chore(catalog): tek MP4 medya hazir ($TITLE_ID)"
          git push
