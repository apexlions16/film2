name: Build Android APKs

on:
  push:
    branches:
      - "agent/direct-mp4-media"
      - "agent/netflix-player-ux"
    tags:
      - "v*"
    paths:
      - "apps/android-player/**"
      - "apps/android-studio/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/android-player/**"
      - "apps/android-studio/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

# UI gelistirirken pes pese commitlerde eski APK build'leri kuyrukta beklemesin.
# Ayni branch/ref icin sadece en son commit'in build'i kaynak tutsun.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [android-player, android-studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Kalici Android imzasini kontrol et
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret'i eksik. Tag release'i gecici debug anahtariyla imzalanamaz."
              missing=1
            fi
          done
          exit "$missing"

      - name: Gradle ile derle
        working-directory: apps/${{ matrix.app }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: APK'yi benzersiz adla yeniden adlandir
        id: apk
        working-directory: apps/${{ matrix.app }}/app/build/outputs/apk/release
        run: |
          mv app-release.apk ${{ matrix.app }}.apk
          echo "path=apps/${{ matrix.app }}/app/build/outputs/apk/release/${{ matrix.app }}.apk" >> "$GITHUB_OUTPUT"

      - name: Imza secret'i var mi kontrol et
        id: keystore_check
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "present=$([ -n "$KS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: APK'yi kalici keystore ile imzala
        if: steps.keystore_check.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          $ANDROID_HOME/build-tools/*/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass pass:"$ANDROID_KEY_PASSWORD" \
            ${{ steps.apk.outputs.path }}
          $ANDROID_HOME/build-tools/*/apksigner verify --verbose ${{ steps.apk.outputs.path }}
          rm -f /tmp/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}

      - name: Player build durumunu kaydet
        if: always() && matrix.app == 'android-player' && (github.ref == 'refs/heads/agent/direct-mp4-media' || github.ref == 'refs/heads/agent/netflix-player-ux')
        run: |
          git config user.name "film2-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="${GITHUB_REF#refs/heads/}"
          {
            echo "status=${{ job.status }}"
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/android-build-last-status.txt
          git add .github/android-build-last-status.txt
          git diff --cached --quiet || git commit -m "chore(ci): player build durumu"
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH" || true
