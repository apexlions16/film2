name: Build Android APKs

# "v*" tag'i atildiginda (ya da elle workflow_dispatch ile) android-player ve
# android-studio icin APK uretir. Tag release'lerinde kalici keystore zorunludur:
# farkli imzayla uretilen APK eski uygulamanin ustune kurulamaz ve kullanici verisi
# tasinamaz. Manuel workflow calistirmalari imzasiz/test artifact'i uretebilir.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "apps/android-studio/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [android-player, android-studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Kalici Android imzasini kontrol et
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret'i eksik. Tag release'i gecici debug anahtariyla imzalanamaz."
              missing=1
            fi
          done
          exit "$missing"

      - name: Gradle ile derle
        working-directory: apps/${{ matrix.app }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: APK'yi benzersiz adla yeniden adlandir
        id: apk
        working-directory: apps/${{ matrix.app }}/app/build/outputs/apk/release
        run: |
          mv app-release.apk ${{ matrix.app }}.apk
          echo "path=apps/${{ matrix.app }}/app/build/outputs/apk/release/${{ matrix.app }}.apk" >> "$GITHUB_OUTPUT"

      - name: Imza secret'i var mi kontrol et
        id: keystore_check
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "present=$([ -n "$KS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: APK'yi kalici keystore ile imzala
        if: steps.keystore_check.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          $ANDROID_HOME/build-tools/*/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass pass:"$ANDROID_KEY_PASSWORD" \
            ${{ steps.apk.outputs.path }}
          $ANDROID_HOME/build-tools/*/apksigner verify --verbose ${{ steps.apk.outputs.path }}
          rm -f /tmp/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
