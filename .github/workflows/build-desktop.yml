name: Build desktop apps

# "v*" tag'i atildiginda (ya da elle workflow_dispatch ile) desktop-player ve
# desktop-studio icin Windows installer'lari uretir ve GitHub Release'e ekler.
# NOT: push+tags ile ayni anda paths filtresi kullanmak tag push'larini
# tetiklememe riski tasiyor (dogrulandi) — bilerek path filtresiz birakildi.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [desktop-player, desktop-studio]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --workspaces=false: npm workspace hoisting node_modules/electron'u repo
      # kokune tasiyor, electron-builder ise electron surumunu uygulama klasorunun
      # KENDI node_modules'inden okumaya calisiyor ve bulamayip hata veriyor
      # (electron-builder/issues/3984). Yerel, izole bir kurulum bunu onluyor.
      - name: Bagimliliklari kur
        run: npm install --workspaces=false
        working-directory: apps/${{ matrix.app }}

      - name: Windows installer derle
        run: npm run build:win
        working-directory: apps/${{ matrix.app }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: apps/${{ matrix.app }}/release/*.exe

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/${{ matrix.app }}/release/*.exe
