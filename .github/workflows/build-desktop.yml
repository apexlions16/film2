name: Build desktop apps

on:
  push:
    branches:
      - "agent/windows-ux-v2"
    tags:
      - "v*"
    paths:
      - "apps/desktop-player/**"
      - "apps/desktop-studio/**"
      - "packages/catalog-schema/**"
      - "packages/catalog-client/**"
      - "packages/hf-storage/**"
      - ".github/workflows/build-desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop-player/**"
      - "apps/desktop-studio/**"
      - "packages/catalog-schema/**"
      - "packages/catalog-client/**"
      - "packages/hf-storage/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch: {}

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [desktop-player, desktop-studio]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bagimliliklari kur
        run: npm install --workspaces=false
        working-directory: apps/${{ matrix.app }}

      - name: TypeScript ve renderer build
        run: npm run build
        working-directory: apps/${{ matrix.app }}

      - name: Windows installer derle
        run: npm run build:win
        working-directory: apps/${{ matrix.app }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: apps/${{ matrix.app }}/release/*.exe

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/${{ matrix.app }}/release/*.exe

      - name: Branch build durumunu kaydet
        if: always() && github.ref == 'refs/heads/agent/windows-ux-v2'
        shell: bash
        run: |
          git config user.name "film2-bot"
          git config user.email "actions@users.noreply.github.com"
          FILE=".github/${{ matrix.app }}-build-status.txt"
          {
            echo "status=${{ job.status }}"
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$FILE"
          git add "$FILE"
          git diff --cached --quiet || git commit -m "chore(ci): ${{ matrix.app }} Windows build durumu"
          git pull --rebase origin agent/windows-ux-v2 || true
          git push origin HEAD:agent/windows-ux-v2 || true
