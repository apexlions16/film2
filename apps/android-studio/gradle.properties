org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# This repo's absolute path contains non-ASCII characters (Turkish folder names).
# AGP hard-fails on that by default on Windows; this repo can't be relocated from here,
# so the check is explicitly overridden. See http://b.android.com/95744.
android.overridePathCheck=true
android.suppressUnsupportedCompileSdk=35
